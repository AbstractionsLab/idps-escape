training:
  aggregation: true
  aggregation_config:
    features:
      data.cpu_usage_%:
      - average
      data.memory_usage_%:
      - average
    fill_na_method: Fixed
    granularity: 30s
    padding_value: 1
  categorical_features: false
  columns:
  - data.cpu_usage_%
  - data.memory_usage_%
  display_name: detector_3min_monitoring
  index_date: '2024-05-*'
  train_config:
    epochs: 2
    window_size: 6

#### decoders ####

- name: decoders | Copy RADAR local_decoder snippet into container
  shell: |
    C="{{ _mgr_container }}"
    SRC="{{ src }}"
    DEST_SNIP="/tmp/radar_snippets"
    copied=0

    if [ -f "$SRC/local_decoder.xml" ]; then
      docker cp "$SRC/local_decoder.xml" "$C:$DEST_SNIP/local_decoder.xml"
      copied=1
    fi

    if [ "$copied" -eq 1 ]; then
      echo COPIED
    else
      echo NOCHANGE
    fi
  args:
    executable: /bin/bash
  register: _docker_cp_snips_local
  changed_when: _docker_cp_snips_local.stdout is search("COPIED")

- name: decoders | Append RADAR decoders (idempotent, EOF)
  shell: |
    docker exec "{{ _mgr_container }}" bash -lc '
      f="/var/ossec/etc/decoders/local_decoder.xml"
      s="/tmp/radar_snippets/local_decoder.xml"
      begin="<!-- RADAR_DECODERS: {{ scenario_name }} BEGIN -->"
      end="<!-- RADAR_DECODERS: {{ scenario_name }} END -->"

      # If this scenario has no decoder snippet, do nothing
      if [ ! -f "$s" ]; then
        echo "NOCHANGE"
        exit 0
      fi

      # ensure target file exists and has proper perms (do NOT truncate)
      touch "$f"
      chown root:wazuh "$f" || true
      chmod 0640 "$f" || true

      # skip if marker is already present
      if grep -Fq "$begin" "$f"; then
        echo "NOCHANGE"
      else
        {
          echo "$begin"
          cat "$s"
          echo "$end"
        } >> "$f"
        echo "CHANGED"
      fi
    '
  args:
    executable: /bin/bash
  register: _dec_insert
  changed_when: _dec_insert.stdout is search("CHANGED")


#### 0310-ssh decoders ####
# {{ src }}

- block:
    - name: decoders | Copy 0310-ssh.xml to local decoders and exclude shipped decoder
      shell: |
        set -euo pipefail
        C="{{ _mgr_container }}"
        SRC_LOCAL="{{ src }}/0310-ssh.xml"
        DST_LOCAL="/var/ossec/etc/decoders/0310-ssh.xml"
        OSSEC_CONF="/var/ossec/etc/ossec.conf"
        EXCL_LINE="    <decoder_exclude>0310-ssh_decoders.xml</decoder_exclude>"
        CHANGED=0

        docker cp "$SRC_LOCAL" "$C:$DST_LOCAL"
        docker exec "$C" bash -lc "chown root:wazuh '$DST_LOCAL' && chmod 0660 '$DST_LOCAL'"
        CHANGED=1

        if ! docker exec "$C" bash -lc "grep -Fq '$EXCL_LINE' '$OSSEC_CONF' >/dev/null 2>&1"; then
          docker exec "$C" bash -lc "awk -v excl='$EXCL_LINE' '1; /<ruleset>/ && !x { print excl; x=1 }' '$OSSEC_CONF' > /tmp/ossec.conf.ansible && mv /tmp/ossec.conf.ansible '$OSSEC_CONF' && chown root:wazuh '$OSSEC_CONF' && chmod 0640 '$OSSEC_CONF'"
          CHANGED=1
        fi

        if [ "$CHANGED" -eq 1 ]; then
          echo CHANGED
        else
          echo NOCHANGE
        fi
      args:
        executable: /bin/bash
      register: _docker_local_0310_changes
      changed_when: "'CHANGED' in _docker_local_0310_changes.stdout"
  when: scenario_name == 'suspicious_login' or scenario_name == 'geoip_detection'

#### whitelist / lists ####

- name: lists | Resolve whitelist source path on docker host
  set_fact:
    _whitelist_src_host: >-
      {{ _whitelist_src if _mgr_mode == 'docker_local'
         else _stage.path ~ '/' ~ _whitelist_name }}

- name: lists | Stat whitelist source on docker host
  stat:
    path: "{{ _whitelist_src_host }}"
  register: _wl_src_stat
  changed_when: false

- name: lists | Ensure lists dir exists in container
  command: docker exec "{{ _mgr_container }}" mkdir -p "{{ _lists_dir }}"
  when: _wl_src_stat.stat.exists

- name: lists | Copy whitelist_countries into container (only if source exists)
  when: _wl_src_stat.stat.exists
  command: >
    docker cp "{{ _whitelist_src_host }}"
    "{{ _mgr_container }}:{{ _lists_dir }}/{{ _whitelist_name }}"
  register: _wl_cp_local

- name: lists | Set whitelist ownership/perm in container
  when: _wl_src_stat.stat.exists
  command: >
    docker exec "{{ _mgr_container }}" bash -lc
    'chown root:wazuh "{{ _lists_dir }}/{{ _whitelist_name }}" && chmod 0664 "{{ _lists_dir }}/{{ _whitelist_name }}"'

- name: lists | Insert whitelist <list> into ossec.conf ruleset (if whitelist exists)
  when: _wl_src_stat.stat.exists
  shell: |
    C="{{ _mgr_container }}"
    OSSEC_CONF="/var/ossec/etc/ossec.conf"
    LIST_PATH="/var/ossec/etc/lists/{{ _whitelist_name }}"
    LIST_ENTRY="    <list>etc/lists/{{ _whitelist_name }}</list>"

    # if the list file is not in the container, exit quietly
    if ! docker exec "$C" test -f "$LIST_PATH"; then
      echo "NOCHANGE"
      exit 0
    fi

    # if entry already present, do nothing
    if docker exec "$C" grep -Fq "$LIST_ENTRY" "$OSSEC_CONF"; then
      echo "NOCHANGE"
      exit 0
    fi

    # otherwise insert the list entry after <ruleset>
    docker exec "$C" sed -i "/<ruleset>/a $LIST_ENTRY" "$OSSEC_CONF"
    echo "CHANGED"
  args:
    executable: /bin/bash
  register: _docker_insert_list_local
  changed_when: "'CHANGED' in _docker_insert_list_local.stdout"

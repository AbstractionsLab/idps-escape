#### Bootstrap Manager ####
- name: Bootstrap manager (docker compose up)
  become: true
  block:
    - name: Ensure remote bootstrap dir tree exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ _stage.path }}"
        - "{{ _stage.path }}/docker/wazuh-dashboard"
        - "{{ _stage.path }}/config"

    - name: Copy docker/wazuh-dashboard/ (recursive)
      ansible.builtin.copy:
        src: "docker/wazuh-dashboard/"
        dest: "{{ _stage.path }}/docker/wazuh-dashboard/"
        mode: "0644"
        directory_mode: "0755"

    - name: Copy config/ (recursive)
      ansible.builtin.copy:
        src: "config/"
        dest: "{{ _stage.path }}/config/"
        mode: "0644"
        directory_mode: "0755"

    - name: Copy docker-compose.core.yml
      ansible.builtin.copy:
        src: "docker-compose.core.yml"
        dest: "{{ _stage.path }}/docker-compose.core.yml"
        mode: "0644"

    - name: Compose up -d
      shell: docker compose -f "{{ _stage.path }}/docker-compose.core.yml" up -d
      args: { executable: /bin/bash }
      register: _boot_up

    - name: Wait for manager container to be running
      shell: |
        docker ps --format '{{"{{.Names}}"}}' | grep -E '^{{ _mgr_container }}$' || exit 1
      args: { executable: /bin/bash }
      register: _boot_ps
      retries: 20
      delay: 3
      until: _boot_ps.rc == 0

#### Bootstrap Webhook ####
- name: Bootstrap webhook (docker compose up)
  become: true
  block:
    - name: Check if webhook container is already running
      shell: |
        docker ps --format '{{"{{.Names}}"}}' | grep -E 'ad-webhook'
      args:
        executable: /bin/bash
      register: _webhook_ps
      failed_when: _webhook_ps.rc not in [0,1]
      changed_when: false

    - name: Stage and start webhook
      when: _webhook_ps.rc != 0
      block:
        - name: Ensure remote webhook stage dirs exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ _stage.path }}"
            - "{{ _stage.path }}/webhook"

        - name: Copy webhook/ (recursive)
          ansible.builtin.copy:
            src: "webhook/"
            dest: "{{ _stage.path }}/webhook/"
            mode: "0644"
            directory_mode: "0755"
            owner: "{{ ansible_user | default(omit) }}"
            group: "{{ ansible_user | default(omit) }}"

        - name: Copy docker-compose.webhook.yml
          ansible.builtin.copy:
            src: "docker-compose.webhook.yml"
            dest: "{{ _stage.path }}/docker-compose.webhook.yml"
            mode: "0644"

        - name: docker compose up webhook
          shell: docker compose -f "{{ _stage.path }}/docker-compose.webhook.yml" up -d
          args:
            executable: /bin/bash
          register: _webhook_boot_up

        - name: Wait for webhook container to be running
          shell: |
            docker ps --format '{{"{{.Names}}"}}' | grep -E 'ad-webhook' || exit 1
          args:
            executable: /bin/bash
          register: _webhook_boot_ps
          retries: 20
          delay: 3
          until: _webhook_boot_ps.rc == 0
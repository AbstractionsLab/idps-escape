#### ossec.conf ####
- name: ossec | Check RADAR ossec snippet exists on controller
  delegate_to: localhost
  stat:
    path: "{{ _scenario_path }}/radar-ossec-snippet.xml"
  register: _radar_ossec_snip
  changed_when: false

- name: ossec | Copy RADAR snippets into container (if present)
  shell: |
    C="{{ _mgr_container }}"
    SRC="{{ src }}"
    DEST_SNIP="/tmp/radar_snippets"
    copied=0

    if [ -f "$SRC/radar-ossec-snippet.xml" ]; then
      docker cp "$SRC/radar-ossec-snippet.xml" "$C:$DEST_SNIP/radar-ossec-snippet.xml"
      copied=1
    fi

    if [ "$copied" -eq 1 ]; then
      echo COPIED
    else
      echo NOCHANGE
    fi
  args:
    executable: /bin/bash
  register: _docker_cp_snips_local
  changed_when: _docker_cp_snips_local.stdout is search("COPIED")

- name: ossec | Check custom SSH decoder override exists in manager container
  shell: |
    docker exec "{{ _mgr_container }}" test -f /var/ossec/etc/decoders/0310-ssh.xml
  args:
    executable: /bin/bash
  register: _ssh_decoder_override
  changed_when: false
  failed_when: false

- name: ossec | Copy ossec.conf from container to /tmp
  shell: |
    docker cp "{{ _mgr_container }}:/var/ossec/etc/ossec.conf" "/tmp/ossec.conf.from_container" || true
    test -s /tmp/ossec.conf.from_container
    echo SOURCE=/tmp/ossec.conf.from_container
  args:
    executable: /bin/bash
  register: _ossec_pull
  changed_when: false

- name: ossec | Insert RADAR ossec snippet into local copy (idempotent)
  when:
    - _radar_ossec_snip.stat.exists
    - _ossec_pull.rc == 0
  blockinfile:
    path: /tmp/ossec.conf.from_container
    marker: "<!-- RADAR: {{ scenario_name }} {mark} -->"
    insertbefore: '</ossec_config>'
    block: "{{ lookup('file', _scenario_path ~ '/radar-ossec-snippet.xml') }}"
    backup: false
  register: _ossec_insert

- name: ossec | Check if SSH decoder_exclude already exists in ossec.conf
  when:
    - _ossec_pull.rc == 0
    - _ssh_decoder_override.rc == 0
  shell: |
    grep -F '<decoder_exclude>0310-ssh_decoders.xml</decoder_exclude>' /tmp/ossec.conf.from_container
  args:
    executable: /bin/bash
  register: _ssh_decoder_exclude_present
  changed_when: false
  failed_when: false

- name: ossec | Ensure default SSH decoders are excluded when custom override exists
  when:
    - _ossec_pull.rc == 0
    - _ssh_decoder_override.rc == 0
    - _ssh_decoder_exclude_present.rc != 0
  blockinfile:
    path: /tmp/ossec.conf.from_container
    marker: "<!-- RADAR: ssh decoder_exclude {mark} -->"
    insertbefore: "</ruleset>"
    block: |
      <!-- RADAR: exclude built-in SSH decoders because /etc/decoders/0310-ssh.xml is used -->
      <decoder_exclude>0310-ssh_decoders.xml</decoder_exclude>
  register: _ssh_decoder_exclude_insert

- name: ossec | Ensure logall is 'yes' in ossec.conf
  when: _ossec_pull.rc == 0
  ansible.builtin.replace:
    path: /tmp/ossec.conf.from_container
    regexp: '(<logall>)[^<]*(</logall>)'
    replace: '\1yes\2'
    backup: no
  register: _ossec_logall

- name: ossec | Ensure logall_json is 'yes' in ossec.conf
  when: _ossec_pull.rc == 0
  ansible.builtin.replace:
    path: /tmp/ossec.conf.from_container
    regexp: '(<logall_json>)[^<]*(</logall_json>)'
    replace: '\1yes\2'
    backup: no
  register: _ossec_logall_json

- name: ossec | Copy modified ossec.conf back into container (if changed)
  when:
    - _ossec_pull.rc == 0
    - >
      (_ossec_insert is defined and _ossec_insert.changed) or
      (_ssh_decoder_exclude_insert is defined and _ssh_decoder_exclude_insert.changed) or
      (_ossec_logall is defined and _ossec_logall.changed) or
      (_ossec_logall_json is defined and _ossec_logall_json.changed)
  shell: |
    docker cp /tmp/ossec.conf.from_container "{{ _mgr_container }}:/var/ossec/etc/ossec.conf"
    echo COPIED
  args:
    executable: /bin/bash
  register: _ossec_push
  changed_when: "'COPIED' in _ossec_push.stdout"

- name: ossec | Fix ownership/perm of ossec.conf in container
  when: _ossec_push is defined and _ossec_push.changed
  shell: |
    docker exec "{{ _mgr_container }}" bash -lc '
      if [ -f "/var/ossec/etc/ossec.conf" ]; then
        chown root:wazuh "/var/ossec/etc/ossec.conf" || true
        chmod 0640 "/var/ossec/etc/ossec.conf" || true
      fi
    '
  args:
    executable: /bin/bash

- name: ossec | Decide if restart is needed
  set_fact:
    _restart_needed: >-
      {{
        (_ossec_insert is defined and _ossec_insert.changed) or
        (_ssh_decoder_exclude_insert is defined and _ssh_decoder_exclude_insert.changed) or
        (_ossec_logall is defined and _ossec_logall.changed) or
        (_ossec_logall_json is defined and _ossec_logall_json.changed) or
        (_dec_insert is defined and _dec_insert.changed) or
        (_rules_insert is defined and _rules_insert.changed) or
        (_scripts_sync is defined and _scripts_sync.changed) or
        (_docker_insert_list_local is defined and _docker_insert_list_local.changed)
      }}

- name: ossec | Restart Wazuh service in manager container if needed
  command: docker exec "{{ _mgr_container }}" /var/ossec/bin/wazuh-control restart
  when:
    - _restart_needed | default(false) | bool
    - _ossec_push is defined
    - _ossec_push.changed

- name: ossec | Cleanup temporary ossec.conf copy
  file:
    path: /tmp/ossec.conf.from_container
    state: absent
  when: _ossec_pull.rc == 0

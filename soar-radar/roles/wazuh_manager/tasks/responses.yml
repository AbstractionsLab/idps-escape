#### active_responses.env ####
- name: responses | Resolve .env source path on docker host
  set_fact:
    _active_responses_env_src_host: >-
      {{ '.env' if _mgr_mode == 'docker_local'
         else _stage.path ~ '/.env' }}

- name: responses | Stat active_responses.env source on docker host
  stat:
    path: "{{ _active_responses_env_src_host }}"
  register: _active_responses_env_stat
  changed_when: false

- name: responses | Copy active_responses.env to container (if present)
  when: _active_responses_env_stat.stat.exists
  shell: |
    C="{{ _mgr_container }}"
    SRC="{{ _active_responses_env_src_host }}"
    DEST="{{ _active_responses_env_dest }}"
    docker cp "$SRC" "$C:$DEST"
    docker exec "$C" chown root:wazuh "$DEST" || true
    docker exec "$C" chmod 0640 "$DEST" || true
  args:
    executable: /bin/bash
  register: _active_env_cp
  failed_when: _active_env_cp.rc not in [0,1]
  changed_when: _active_env_cp.rc == 0


#### email_ar.py ####
- name: responses | Resolve email_ar source path on docker host
  set_fact:
    _email_ar_src_host: >-
      {{ _email_ar_src if _mgr_mode == 'docker_local'
         else _stage.path ~ '/email_ar.py' }}

- name: responses | Stat email_ar.py on docker host
  stat:
    path: "{{ _email_ar_src_host }}"
  register: _email_ar_host_stat
  changed_when: false

- name: responses | Copy email_ar.py into container if missing or checksum differs
  when: _email_ar_host_stat.stat.exists
  block:
    - name: responses | Get remote email_ar.py checksum
      shell: >
        docker exec "{{ _mgr_container }}" bash -lc
        'if [ -f "{{ _email_ar_dest }}" ]; then sha256sum "{{ _email_ar_dest }}" | awk "{print \$1}"; else echo MISSING; fi'
      register: _remote_email_sum
      changed_when: false

    - name: responses | Copy email_ar.py when missing or changed
      when: >
        (_remote_email_sum.stdout == 'MISSING') or
        (_remote_email_sum.stdout != (lookup('file', _email_ar_src) | hash('sha256')))
      shell: |
        docker cp "{{ _email_ar_src_host }}" "{{ _mgr_container }}:{{ _email_ar_dest }}"
      args:
        executable: /bin/bash

    - name: responses | Set ownership/perm for email_ar in container
      shell: |
        docker exec "{{ _mgr_container }}" bash -lc '
          if [ -f "{{ _email_ar_dest }}" ]; then
            chown root:wazuh "{{ _email_ar_dest }}" &&
            chmod 0750 "{{ _email_ar_dest }}"
          fi
        '
      args:
        executable: /bin/bash


#### ad_context_*.py ####
- name: responses | Copy ad_context_*.py only if content differs
  shell: |
    SRC="{{ _ar_src_dir }}"
    C="{{ _mgr_container }}"
    DEST="/var/ossec/active-response/bin"
    changed=0

    for f in "$SRC"/ad_context_*.py; do
      [ -e "$f" ] || continue
      base="$(basename "$f")"
      lsum="$(sha256sum "$f" | awk '{print $1}')"

      if docker exec "$C" test -f "$DEST/$base"; then
        rsum="$(docker exec "$C" bash -lc "sha256sum \"$DEST/$base\" | awk '{print \\$1}'" 2>/dev/null || echo MISSING)"
      else
        rsum="MISSING"
      fi

      if [ "$lsum" != "$rsum" ]; then
        docker cp "$f" "$C:$DEST/$base"
        docker exec "$C" bash -lc "chown root:wazuh \"$DEST/$base\" && chmod 0750 \"$DEST/$base\""
        changed=1
      fi
    done

    [ $changed -eq 1 ] && echo CHANGED || echo NOCHANGE
  args:
    executable: /bin/bash
  register: _scripts_sync
  changed_when: _scripts_sync.stdout is search("CHANGED")

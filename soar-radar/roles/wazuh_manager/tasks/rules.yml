#### rules ####

- name: rules | Copy RADAR local_rules snippet into container
  shell: |
    C="{{ _mgr_container }}"
    SRC="{{ src }}"
    DEST_SNIP="/tmp/radar_snippets"
    copied=0

    if [ -f "$SRC/local_rules.xml" ]; then
      docker cp "$SRC/local_rules.xml" "$C:$DEST_SNIP/local_rules.xml"
      copied=1
    fi

    if [ "$copied" -eq 1 ]; then
      echo COPIED
    else
      echo NOCHANGE
    fi
  args:
    executable: /bin/bash
  register: _docker_cp_snips_local
  changed_when: _docker_cp_snips_local.stdout is search("COPIED")

- name: rules | Append RADAR rules (idempotent, EOF)
  shell: |
    docker exec "{{ _mgr_container }}" bash -lc '
      f="/var/ossec/etc/rules/local_rules.xml"
      s="/tmp/radar_snippets/local_rules.xml"
      begin="<!-- RADAR_RULES: {{ scenario_name }} BEGIN -->"
      end="<!-- RADAR_RULES: {{ scenario_name }} END -->"

      # If this scenario has no rules snippet, do nothing
      if [ ! -f "$s" ]; then
        echo "NOCHANGE"
        exit 0
      fi

      # ensure target file exists and has proper perms (do NOT truncate)
      touch "$f"
      chown root:wazuh "$f" || true
      chmod 0640 "$f" || true

      # skip if marker is already present
      if grep -Fq "$begin" "$f"; then
        echo "NOCHANGE"
      else
        {
          echo "$begin"
          cat "$s"
          echo "$end"
        } >> "$f"
        echo "CHANGED"
      fi
    '
  args:
    executable: /bin/bash
  register: _rules_insert
  changed_when: _rules_insert.stdout is search("CHANGED")

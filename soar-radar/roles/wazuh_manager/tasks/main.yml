- name: Resolve basic manager vars
  set_fact:
    _scenario_path: "{{ scenario_path }}"
    _mgr_mode: "{{ hostvars[inventory_hostname].manager_mode }}"
    _mgr_container: "{{ hostvars[inventory_hostname].manager_container_name | default('wazuh.manager') }}"
    _email_ar_dest: "/var/ossec/active-response/bin/email_ar.py"
    _active_responses_env_dest: "/var/ossec/active-response/bin/active_responses.env"
    _whitelist_name: "whitelist_countries"
    _lists_dir: "/var/ossec/etc/lists"
    _list_marker: "RADAR: {{ scenario_name }} whitelist_countries"

- name: Resolve scenario-derived paths
  set_fact:
    _email_ar_src: "{{ _scenario_path }}/active_responses/email_ar.py"
    _whitelist_src: "{{ _scenario_path }}/whitelist_countries"
    _radar_snippet_src: "{{ _scenario_path }}/radar-ossec-snippet.xml"
    _local_rules_src: "{{ _scenario_path }}/local_rules.xml"
    _local_decoder_src: "{{ _scenario_path }}/local_decoder.xml"

- name: Resolve docker host / privilege vars (for docker modes)
  when: _mgr_mode in ['docker_local', 'docker_remote']
  set_fact:
    _mgr_docker_delegate: "{{ 'localhost' if _mgr_mode == 'docker_local' else inventory_hostname }}"
    _mgr_docker_become: "{{ _mgr_mode == 'docker_remote' }}"

- name: Show resolved manager mode
  debug:
    msg: "manager_mode for {{ inventory_hostname }} = {{ _mgr_mode }}"


# =================
# docker_local
# =================

- block:
    - name: local docker | Check manager container is running (with retries)
      delegate_to: localhost
      shell: |
        docker ps --format '{{"{{.Names}}"}}' | grep -E '^{{ _mgr_container }}$'
      args:
        executable: /bin/bash
      register: _mgr_local_container
      changed_when: false
      retries: 3
      delay: 30
      until: _mgr_local_container.rc == 0

    - name: local docker | Reset /tmp/radar_snippets inside container
      delegate_to: localhost
      shell: |
        docker exec "{{ _mgr_container }}" bash -lc '
          rm -rf /tmp/radar_snippets && mkdir -p /tmp/radar_snippets
        '
      args:
        executable: /bin/bash

    - name: local docker | Active responses
      delegate_to: localhost
      block:
        - include_tasks: responses.yml
          vars:
            src: "{{ _scenario_path }}"
            dst: "{{ _active_responses_env_dest }}"
            _ar_src_dir: "{{ _scenario_path }}/active_responses"

    - name: local docker | Lists
      delegate_to: localhost
      block:
        - include_tasks: lists.yml

    - name: local docker | Decoders
      delegate_to: localhost
      block:
        - include_tasks: decoders.yml
          vars:
            src: "{{ _scenario_path }}"

    - name: local docker | Rules
      delegate_to: localhost
      block:
        - include_tasks: rules.yml
          vars:
            src: "{{ _scenario_path }}"

    - name: local docker | Ossec Configurations
      delegate_to: localhost
      block:
        - include_tasks: ossec.yml
          vars:
            src: "{{ _scenario_path }}"

    - name: local docker | Filebeat
      delegate_to: localhost
      block:
        - include_tasks: filebeat.yml

  when: _mgr_mode == 'docker_local'


# ==================
# docker_remote
# ==================

- block:

    - name: remote docker | Stage scenario artifacts
      become: true
      block:
        - import_tasks: stage.yml

    - name: remote docker | Bootstrap manager & webhook (docker compose up) if requested
      when: (manager_bootstrap | default(false)) | bool
      become: true
      block:
        - include_tasks: bootstrap.yml

    - name: remote docker | Check manager container is running
      become: true
      shell: |
        docker ps --format '{{"{{.Names}}"}}' | grep -E '^{{ _mgr_container }}$'
      args:
        executable: /bin/bash
      register: _mgr_remote_container
      changed_when: false
      retries: 3
      delay: 30
      until: _mgr_remote_container.rc == 0

    - name: remote docker | Reset /tmp/radar_snippets inside container
      become: true
      shell: |
        docker exec "{{ _mgr_container }}" bash -lc '
          rm -rf /tmp/radar_snippets && mkdir -p /tmp/radar_snippets
        '
      args:
        executable: /bin/bash

    - name: remote docker | Active responses
      become: true
      block:
        - include_tasks: responses.yml
          vars:
            src: "{{ _scenario_path }}"
            dst: "{{ _active_responses_env_dest }}"
            _ar_src_dir: "{{ _stage.path }}"

    - name: remote docker | Lists
      become: true
      block:
        - include_tasks: lists.yml

    - name: remote docker | Decoders
      become: true
      block:
        - include_tasks: decoders.yml
          vars:
            src: "{{ _stage.path }}"

    - name: remote docker | Rules
      become: true
      block:
        - include_tasks: rules.yml
          vars:
            src: "{{ _stage.path }}"

    - name: remote docker | Ossec Configurations
      become: true
      block:
        - include_tasks: ossec.yml
          vars:
            src: "{{ _stage.path }}"

    - name: remote docker | Filebeat
      become: true
      block:
        - include_tasks: filebeat.yml

  when: _mgr_mode == 'docker_remote'


# ================
# host_remote
# ================

- block:
    - name: remote host | Apply RADAR scenario on host-based manager
      include_tasks: host.yml
  when: _mgr_mode == 'host_remote'

# Lateral Movement Detection Scenario
# =====================================
# This scenario detects potential lateral movement within the network by
# monitoring authentication patterns across multiple hosts and identifying
# unusual access patterns that may indicate an attacker moving through
# the infrastructure.
#
# Attack patterns detected:
# 1. Unusual agent/host access patterns (new hosts being accessed)
# 2. Rapid authentication across multiple hosts
# 3. Off-hours authentication activity
# 4. Geographic anomalies (if GeoIP data available)

name: "Lateral Movement Detection"
description: "Detect lateral movement via authentication pattern analysis across hosts"
enabled: true

training:
  lookback_hours: 336  # 14 days for better baseline
  
  numeric_fields:
    - "rule.level"
  
  categorical_fields:
    - "rule.groups"
    - "agent.id"
    - "agent.name"
  
  categorical_top_k: 20
  bucket_minutes: 10  # Larger buckets for movement patterns
  sliding_window: 144  # ~24 hours at 10-min buckets
  # interval: 1 trains on every window position: 14 days = 2016 buckets -> 1200 gradient
  # steps. Training needs at least 730 buckets from the first alert (empty buckets count) with these settings.
  extra_params:
    interval: 1
  # Per-bucket counts of authentication and privilege events across hosts
  derived_features:
    - is_auth_failure
    - is_auth_success
    - is_privilege_event
    - is_ssh_event
    - is_windows_logon
    - is_high_severity

# Shipping configuration (optional - enables data streaming to Wazuh)
shipping:
  enabled: false  # Set to true to ship anomalies to a sonar_anomalies_mvad_<id> data stream
  install_templates: true  # Install base templates on first run
  scenario_id: "lateral_movement"  # Custom ID for this scenario

detection:
  mode: "historical"
  # Minutes of complete buckets to score, ending at the last complete bucket. SONAR
  # fetches the earlier context MVAD needs on its own (input_size + threshold_window - 1
  # buckets), so any lookback of at least one bucket works.
  lookback_minutes: 1800
  # Decision rule and confidence calibrated with `sonar evaluate` on the labelled synthetic
  # splits of sonar/test_data (validation split for threshold and min_consecutive, test
  # split precision for anomaly_confidence); see docs/specs/trp/assets/sonar-evaluation/lateral_movement-mvad.md.
  # Recalibrate on labelled data from your own environment.
  threshold: 0.2  # minimum MVAD severity (0-1) on top of MVAD's own anomaly decision
  min_consecutive: 5  # minimum run of consecutive anomalous buckets
  anomaly_confidence: 0.25  # measured precision, sent to Wazuh and used by RADAR

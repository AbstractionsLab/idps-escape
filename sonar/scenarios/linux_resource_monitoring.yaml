# Linux Resource Utilization Monitoring Scenario
# ================================================
# This scenario detects anomalous system resource usage patterns including:
# - Unusual CPU utilization spikes
# - Abnormal memory consumption
# - Resource exhaustion attacks
# - Cryptocurrency mining activity
# - Fork bombs and resource abuse
#
# Features used:
# - data.cpu_usage_%: CPU utilization percentage
# - data.memory_usage_%: Memory utilization percentage
# - rule.level: Alert severity
# - agent.name: System hostname (categorical)
# - derived: Resource usage trends and correlations
#
# Attack patterns detected:
# 1. Sustained high CPU usage (mining, DoS)
# 2. Memory leaks or sudden memory spikes
# 3. Coordinated resource usage across multiple hosts
# 4. Resource exhaustion leading to system instability

name: "Linux Resource Monitoring"
description: "Detect anomalous system resource utilization patterns indicative of attacks or misconfigurations"
enabled: true

model_name: "linux_resource_monitoring"

training:
  # Training window - use 24 hours for test data
  # In production, use 7+ days (168 hours)
  lookback_hours: 24  # Matches test data duration
  
  # Numeric fields to extract from alerts
  # These represent actual resource metrics
  numeric_fields:
    - "data.cpu_usage_%"
    - "data.memory_usage_%"
    - "data.disk_usage_%"
    - "data.1min_loadAverage"
    - "data.5min_loadAverage"
    - "data.15min_loadAverage"
    - "rule.level"
  
  # Per-bucket max columns alongside the default per-bucket mean.
  # Captures brief spikes (e.g. a 55-second mining burst) that averaging would hide.
  max_numeric_fields:
    - "data.cpu_usage_%"
    - "data.memory_usage_%"
  
  # Categorical fields for one-hot encoding
  # Capture which systems are affected
  categorical_fields:
    - "agent.name"      # Hostname - detects per-host anomalies
    - "rule.groups"     # Alert categories
  
  # Limit categories to prevent feature explosion
  # Top-k hosts monitored, rest grouped into __other
  categorical_top_k: 20
  
  # Time bucket size for aggregation
  # 1 minute for fine-grained resource monitoring
  bucket_minutes: 1
  
  # Sliding window size for MVAD model
  # 120 buckets = 2 hours of context at 1-min buckets
  # (300 cannot train on 24 h: the 10% validation split, 144 buckets, would be
  # shorter than the 150-bucket input window.)
  sliding_window: 120
  
  # Derived features: per-bucket counts of metric alerts above a threshold
  derived_features:
    - is_cpu_high
    - is_cpu_critical
    - is_memory_high
    - is_memory_critical
    - is_high_load

  # Metrics are gauges: in a bucket without a metric alert, carry the last value forward
  # instead of reading 0 % CPU. Means are taken only over alerts that carry the field,
  # so SSH or FIM alerts no longer dilute them.
  numeric_fill: ffill
  
  # Filter ingested alerts to performance_metric events only.
  # Prevents SSH, FIM, and other alert types from diluting the resource signal.
  # Matches alerts produced by Wazuh rules 100054-100060 (general_health_check decoder).
  # alert_filter:
  #   terms:
  #     rule.groups:
  #       - performance_metric
  
  # Training parameters
  device: "cpu"  # Use "cuda" if GPU available
  
  # Extra MVAD parameters (any MultiADConfig field of the MVAD library).
  # interval: 1 trains on every window position: 1440 buckets -> 8 batches/epoch,
  # 800 gradient steps. Training needs at least 610 buckets with these settings.
  extra_params:
    interval: 1

# Shipping configuration (optional - enables data streaming to Wazuh)
shipping:
  enabled: false  # Set to true to ship anomalies to a sonar_anomalies_mvad_<id> data stream
  install_templates: true  # Install base templates on first run
  scenario_id: "resource_monitoring"  # Custom ID for this scenario

# Debug configuration (for testing without Wazuh)
debug:
  enabled: false  # Set to true or use --debug CLI flag
  data_dir: "../test_data/resource_monitoring"  # relative to this file
  training_data_file: "resource_monitoring_training.json"  # 24 h, 1440 one-minute buckets
  detection_data_file: "resource_monitoring_detection.json"

detection:
  # Detection mode: "historical" for batch analysis
  mode: "historical"
  
  # Minutes of complete buckets to score, ending at the last complete bucket. SONAR
  # fetches the earlier context MVAD needs on its own (input_size + threshold_window - 1
  # buckets), so any lookback of at least one bucket works.
  # The debug data holds 2 hours of normal context before these 6 hours.
  lookback_minutes: 360
  
  # Decision rule and confidence calibrated with `sonar evaluate` on the labelled synthetic
  # splits of sonar/test_data (validation split for threshold and min_consecutive, test
  # split precision for anomaly_confidence); see docs/specs/trp/assets/sonar-evaluation/resource_monitoring-mvad.md.
  # Recalibrate on labelled data from your own environment.
  threshold: 0.05  # minimum MVAD severity (0-1) on top of MVAD's own anomaly decision
  min_consecutive: 4  # minimum run of consecutive anomalous buckets
  anomaly_confidence: 0.92  # measured precision, sent to Wazuh and used by RADAR
  
  # Polling interval for streaming mode (seconds)
  polling_interval_seconds: 60


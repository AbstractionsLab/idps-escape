text: |
  ## Preconditions and setup actions
  - Docker version 26.0.0
  - User with root privileges
  - Docker Compose version v2.25.0
  curl version 7.81.0
  - Wazuh agent installed and enrolled with the
  manager
  - Deployment of Wazuh Dashboard on the local monitoring
  machine inside a container (4.8.1)
  - Deployment of Wazuh Indexer  on the local monitoring
  machine inside a container (4.8.1)
  - Deployment of Wazuh Manager  on the local monitoring
  machine inside a container (4.8.1)
  - Deployment of Suricata version 7.0.3 on the local monitoring machine
  inside a container
  - GNU nano, version 6.2
  - curl version 7.81.0
  ## Test steps
  1. Edit the configuration file of the Wazuh agent to make it able to read
  Suricata logs.
  `sudo nano /var/ossec/etc/ossec.conf`
  2. Add the suricata eve logs the end of the file, before the last
  `</ossec_config>` closing tag.
  ```
  <ossec_config>
  ...
    <localfile>
      <log_format>json</log_format>
      <location>/var/log/suricata/eve.json</location>
    </localfile>
  </ossec_config>

  ```
  3. Remove the Suricata container.
  `sudo docker rm suricata-instance`
  4. Run the Suricata container again with adding arguments to create docker
  volumes.
  ```
  sudo docker run -v
  /var/log/suricata:/var/log/suricata --network=host
  --hostname=suricata-instance --name=suricatainstance
  -d suricata-container
  ```
  5. Restart the Wazuh agent
  ```
  sudo systemctl restart wazuh-agent
  ```
  6. Generate some malicious network traffic by sending a curl request to the
  following tool.
  ```
  curl -sSL
  https://raw.githubusercontent.com/3CORESec/testmynids.org/master/tmNIDS -o /tmp/tmNIDS && chmod +x /tmp/tmNIDS && /tmp/tmNIDS
  ```
  7. Enter any number from 1 to 11 to generate the respective traffic.
  8. On the Wazuh dashboard, filter the alerts to see the events particularly
  generated by Suricata. This is done by **Threat Hunting > Add Filter**. And to create the filter, in the Field dropdown,
  select *rule.groups*, in the operator dropdown, select *is* and in the
  Value, write *suricata*.

  ## Expected outcome
  -The alert generated by Suricata for the malicious traffic should be seen on
  the Wazuh Dashboard **Threat Hunting**.
  - After filter application, all alerts generated by suricata should be visible.

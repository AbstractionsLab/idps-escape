text: |
  ## Preconditions and setup actions
  - Docker version 26.0.0
  - User with root privileges
  - Docker Compose version v2.25.0
  - Deployment of Wazuh Dashboard version 4.8.1 on the local monitoring machine inside a container
  - Deployment of Wazuh Indexer version 4.8.1 on the local monitoring
  machine inside a container
  - Deployment of Wazuh Manager version 4.8.1 on the local monitoring
  machine inside a container
  - GNU bash, version 5.1.16
  - No prior agent should already be running on the local monitoring machine
  ## Test steps
  1. On the Wazuh Dashboard, go to **Endpoint Summary**, and click on **Deploy
  new agent**.
  2. Select the package to download and install on the respective system
  i.e., Linux DEB amd64.
  3. Provide a server address and an optional name for the agent. The
  server address should be the IP address of the docker host address in the
  case of docker installation on the local monitoring machine.
  -  The docker host address can be found by:
  ```
  sudo docker network inspect bridge | grep Gateway
  ```
  4. Install the agent by running the command that should be provided
  on the dashboard after entering the above information. For example,
  - download
  ```
  wget https://packages.wazuh.com/4.x/apt/pool/main/w/wazuh-agent/wazuh-agent_4.8.1-1_arm64.deb && sudo WAZUH_MANAGER='172.17.0.1' WAZUH_AGENT_GROUP='default' WAZUH_AGENT_NAME='idps-escape-1' dpkg -i ./wazuh-agent_4.8.1-1_arm64.deb
  ```

  5. Start the agent by running the three commands that should also be
  provided on the dashboard, i.e.,
  ```
  sudo systemctl daemon-reload
  sudo systemctl enable wazuh-agent
  sudo systemctl start wazuh-agent
  ```

  ## Expected outcome
  - The status of the agent should be “Started Wazuh agent.” Which is seen
  by running the command:
  sudo systemctl status wazuh-agent.
  - On the Wazuh Dashboard the Agent should appear as active in the summary page.

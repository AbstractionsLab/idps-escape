text: |
  ## Preconditions and setup actions
  - Ubuntu 22.04.4 LTS (Machine 1, central monitoring host)
  - Ubuntu 22.04.4 LTS (Machine 2, target host or the remote machine)
  - Prerequisites for Machine 1:

      - tcpdump version 4.99.1
      - User with root privileges

  - Prerequisites for Machine 2:

      - User with root privileges
      - ping from iputils 20211215
      - GNU bash, version 5.1.16
      - No existing tunnel is configured from machine 2 to machine 1
  ## Test steps
  1. Create a GRE tunnel from machine 2 to machine 1 and mirror all the
  ingress and egress (incoming and outgoing) network traffic generated on
  machine 2 to machine 1. Using the procedure describe in `deployment/remote_monitoring/remote_monitoring.md`.

  2. From machine 2, send some ICMP echo request packets to machine 1.
  ```
  ping -c3 [IP of the capture interface of machine
  1]
  ```
  3. On machine 1, use tcpdump to capture network traffic on the default
  interface.
  ```
  sudo tcpdump -n -i [Capture interface of machine
  1]
  ```
  ## Expected outcome
  tcpdump output should show that machine 1 receives both the ingress and
  egress ICMP packets from machine 2, encapsulated within GRE packets

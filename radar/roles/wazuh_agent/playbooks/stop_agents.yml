---
- name: Stop RADAR agents
  hosts: wazuh_agents_ssh
  become: true
  gather_facts: false

  vars:
    disable_wazuh_agent: "{{ disable_wazuh_agent | default(false) | bool }}"
  
  tasks:
    - name: Stop and disable radar-helper service
      systemd:
        name: radar-helper.service
        state: stopped
        enabled: no
      register: _service_stop
      failed_when: false
      changed_when: _service_stop.changed

    - name: Check if radar-helper service exists
      stat:
        path: /etc/systemd/system/radar-helper.service
      register: _service_file

    - name: Display service stop status
      debug:
        msg: "radar-helper service stopped: {{ _service_stop.changed }}"
      when: _service_file.stat.exists

    - name: Warn if service file not found
      debug:
        msg: "WARNING: radar-helper.service not found on {{ inventory_hostname }}"
      when: not _service_file.stat.exists

    - name: Stop and disable wazuh agent service
      systemd:
        name: wazuh-agent.service
        state: stopped
        enabled: no
      register: _agent_stop
      failed_when: false
      changed_when: _agent_stop.changed
      when: disable_wazuh_agent | bool

    - name: Display wazuh agent stop status
      debug:
        msg: "wazuh-agent service stopped and disabled: {{ _agent_stop.changed }}"
      when: 
        - disable_wazuh_agent | bool
        - _agent_stop is defined

    - name: Note wazuh agent not stopped
      debug:
        msg: "wazuh-agent service NOT stopped (use --disable-wazuh-agent to stop it)"
      when: not disable_wazuh_agent | bool

    - name: Summary for agent
      debug:
        msg:
          - "Agent: {{ inventory_hostname }}"
          - "radar-helper stopped: {{ _service_stop.changed if _service_file.stat.exists else 'N/A' }}"
- name: agent_config | Ensure shared group directory exists
  ansible.builtin.file:
    path: "{{ _host_shared_group_dir }}"
    state: directory

- name: agent_config | Ensure agent.conf exists
  ansible.builtin.file:
    path: "{{ _host_shared_group_dir ~ '/agent.conf' }}"
    state: touch

- name: agent_config | Insert scenario agent_config into agent.conf
  ansible.builtin.blockinfile:
    path: "{{ _host_shared_group_dir ~ '/agent.conf' }}"
    marker: "<!-- {{ _agentconf_marker }} {mark} -->"
    insertbefore: EOF
    block: |
      {{ lookup('file', radar_agent_snippet_src) | indent(2, true) }}
    backup: true

- name: agent_config | Normalize agent.conf ownership/perm
  shell: |
    docker exec "{{ _mgr_container }}" bash -lc '
      chown root:wazuh /var/ossec/etc/shared/{{ _agent_group }}/agent.conf 2>/dev/null || true
      chmod 0660 /var/ossec/etc/shared/{{ _agent_group }}/agent.conf 2>/dev/null || true
    '
  args:
    executable: /bin/bash
  changed_when: false

- name: agent_config | Verify agent.conf configuration
  ansible.builtin.shell: |
    docker exec {{ _mgr_container }} /var/ossec/bin/verify-agent-conf -f /var/ossec/etc/shared/{{ _agent_group }}/agent.conf
  args:
    executable: /bin/bash
  changed_when: false


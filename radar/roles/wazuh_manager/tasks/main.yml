- name: Resolve basic manager vars
  set_fact:
    _mgr_mode: "{{ hostvars[inventory_hostname].manager_mode }}"
    _mgr_container: "{{ hostvars[inventory_hostname].manager_container_name | default('wazuh.manager') }}"
    _mgr_service: "{{ hostvars[inventory_hostname].manager_service_name | default(_mgr_container) }}"
    _active_responses_env_dest: "/var/ossec/active-response/bin/active_responses.env"
    _radar_ar_dest: "/var/ossec/active-response/bin/radar_ar.py"
    _lists_dir: "/var/ossec/etc/lists"
    _list_marker: "RADAR: {{ scenario_name }} whitelist_countries"
    _volumes_yml_path: "{{ volumes_yml_path | default(playbook_dir ~ '/volumes.yml') }}"
    _scenarios_root: "{{ scenarios_root | default(playbook_dir ~ '/scenarios') }}"
    _scenario_slug: "{{ scenario_name | replace('_','-') }}"
    _agent_group: "{{ agent_group | default('default') }}"
    _agentconf_marker: "RADAR: {{ scenario_name }} agent_config"

- name: Resolve scenario-derived paths
  set_fact:
    radar_ar_src: "{{ _scenarios_root }}/active_responses/radar_ar.py"
    ar_config_src: "{{ _scenarios_root }}/active_responses/ar.yaml"
    whitelist_src: "{{ _scenarios_root }}/lists/whitelist_countries"
    decoders_src_dir: "{{ _scenarios_root }}/decoders/{{ scenario_name }}"
    rules_src_dir: "{{ _scenarios_root }}/rules/{{ scenario_name }}"
    radar_snippet_src: "{{ _scenarios_root }}/ossec/radar-{{ _scenario_slug }}-ossec-snippet.xml"
    radar_template_src: "{{ _scenarios_root }}/templates/{{ scenario_name }}/radar-template.json"
    radar_pipeline_snippet_src: "{{ _scenarios_root }}/pipelines/{{ scenario_name }}/radar-pipeline.txt"
    radar_agent_snippet_src: "{{ _scenarios_root }}/agent_configs/{{ scenario_name }}/radar-{{ _scenario_slug }}-agent-snippet.xml"

- name: Load volumes.yml from controller
  delegate_to: localhost
  ansible.builtin.slurp:
    src: "{{ _volumes_yml_path }}"
  register: _volumes_yml_slurp

- name: Parse volumes.yml
  ansible.builtin.set_fact:
    _volumes_yml: "{{ _volumes_yml_slurp.content | b64decode | from_yaml }}"

- name: Extract volumes list from target manager service
  ansible.builtin.set_fact:
    _mgr_vols: "{{ _volumes_yml.services[_mgr_service].volumes | default([]) }}"

- name: Validate volumes list exists
  ansible.builtin.assert:
    that:
      - _mgr_vols | length > 0
    fail_msg: "volumes.yml: first service has no volumes list."

- name: Resolve bind-mount sources (host paths) from volumes list
  ansible.builtin.set_fact:
    _host_ossec_etc: "{{ (_mgr_vols | select('match', '.+:/var/ossec/etc/?$') | list | first) | regex_replace(':(/var/ossec/etc)/?$','') }}"
    _host_active_response_bin: "{{ (_mgr_vols | select('match', '.+:/var/ossec/active-response/bin/?$') | list | first) | regex_replace(':(/var/ossec/active-response/bin)/?$','') }}"
    _host_filebeat_etc_dir: "{{ (_mgr_vols | select('match', '.+:/etc/filebeat/?$') | list | first) | regex_replace(':(/etc/filebeat)/?$','') }}"
    _host_filebeat_modules_dir: "{{ (_mgr_vols | select('match', '.+:/usr/share/filebeat/module/?$') | list | first) | regex_replace(':(/usr/share/filebeat/module)/?$','') }}"

- name: Derive concrete host destinations
  ansible.builtin.set_fact:
    _host_ossec_conf: "{{ _host_ossec_etc ~ '/ossec.conf' }}"
    _host_decoders_dir: "{{ _host_ossec_etc ~ '/decoders' }}"
    _host_rules_dir: "{{ _host_ossec_etc ~ '/rules' }}"
    _host_lists_dir: "{{ _host_ossec_etc ~ '/lists' }}"
    _host_shared_dir: "{{ _host_ossec_etc ~ '/shared' }}"
    _host_filebeat_yml: "{{ _host_filebeat_etc_dir ~ '/filebeat.yml' }}"
    _host_pipeline_json: "{{ _host_filebeat_modules_dir ~ '/wazuh/archives/ingest/pipeline.json' }}"

- name: Derive agent config variables
  ansible.builtin.set_fact:
    _host_shared_group_dir: "{{ _host_shared_dir ~ '/' ~ _agent_group }}"

- name: Validate required bind-mounts exist in volumes.yml
  ansible.builtin.assert:
    that:
      - _host_ossec_etc | length > 0
      - _host_active_response_bin | length > 0
      - _host_filebeat_etc_dir | length > 0
      - _host_filebeat_modules_dir | length > 0
    fail_msg: "volumes.yml is missing required bind mounts for manager paths."

- name: Show resolved manager mode
  debug:
    msg: "manager_mode for {{ inventory_hostname }} = {{ _mgr_mode }}"


# =================
# docker_local
# =================

- block:
    - name: local docker | Check manager container is running (with retries)
      delegate_to: localhost
      shell: |
        docker ps --format '{{"{{.Names}}"}}' | grep -E '^{{ _mgr_container }}$'
      args:
        executable: /bin/bash
      register: _mgr_local_container
      changed_when: false
      retries: 3
      delay: 30
      until: _mgr_local_container.rc == 0

    - name: local docker | Active responses
      delegate_to: localhost
      block:
        - include_tasks: responses.yml

    - name: local docker | Lists
      delegate_to: localhost
      when: scenario_name == 'geoip_detection'
      block:
        - include_tasks: lists.yml

    - name: local docker | Decoders
      delegate_to: localhost
      block:
        - include_tasks: decoders.yml

    - name: local docker | Rules
      delegate_to: localhost
      block:
        - include_tasks: rules.yml
          vars:
            src: "{{ rules_src_dir }}"

    - name: local docker | Centralized agent_config
      delegate_to: localhost
      block:
        - include_tasks: agent_config.yml

    - name: local docker | Ossec Configurations
      delegate_to: localhost
      block:
        - include_tasks: ossec.yml
          vars:
            src: "{{ radar_snippet_src }}"

    - name: local docker | Filebeat
      delegate_to: localhost
      block:
        - include_tasks: filebeat.yml


  when: _mgr_mode == 'docker_local'

- block:
    - name: remote docker | Bootstrap manager & webhook (docker compose up) if requested
      when: (manager_bootstrap | default(false)) | bool
      become: true
      block:
        - include_tasks: bootstrap.yml

    - name: remote docker | Check manager container is running
      become: true
      shell: |
        docker ps --format '{{"{{.Names}}"}}' | grep -E '^{{ _mgr_container }}$'
      args:
        executable: /bin/bash
      register: _mgr_remote_container
      changed_when: false
      retries: 3
      delay: 30
      until: _mgr_remote_container.rc == 0

    - name: remote docker | Active responses
      become: true
      block:
        - include_tasks: responses.yml

    - name: remote docker | Lists
      become: true
      block:
        - include_tasks: lists.yml

    - name: remote docker | Decoders
      become: true
      block:
        - include_tasks: decoders.yml

    - name: remote docker | Rules
      become: true
      block:
        - include_tasks: rules.yml
          vars:
            src: "{{ rules_src_dir }}"

    - name: remote docker | Centralized agent_config (agent.conf)
      become: true
      block:
        - include_tasks: agent_config.yml

    - name: remote docker | Ossec Configurations
      become: true
      block:
        - include_tasks: ossec.yml
          vars:
            src: "{{ radar_snippet_src }}"

    - name: remote docker | Filebeat
      become: true
      block:
        - include_tasks: filebeat.yml

    - name: remote docker | Ensure webhook is running
      become: true
      block:
        - include_tasks: bootstrap_webhook.yml

  when: _mgr_mode == 'docker_remote'


# ================
# host_remote
# ================

- block:
    - name: remote host | Apply RADAR scenario on host-based manager
      include_tasks: host.yml
  when: _mgr_mode == 'host_remote'

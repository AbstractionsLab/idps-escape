#### Bootstrap Manager ####
- name: Bootstrap manager (docker compose up)
  become: true
  block:
    - name: Create staging dir on remote
      become: true
      tempfile:
        state: directory
        prefix: radar_mgr_
      register: _stage

    - name: Ensure remote bootstrap dir tree exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ _stage.path }}"
        - "{{ _stage.path }}/docker/wazuh-dashboard"
        - "{{ _stage.path }}/config"

    - name: Copy docker/wazuh-dashboard/ (recursive)
      ansible.builtin.copy:
        src: "docker/wazuh-dashboard/"
        dest: "{{ _stage.path }}/docker/wazuh-dashboard/"
        mode: "0644"
        directory_mode: "0755"

    - name: Copy config/ (recursive)
      ansible.builtin.copy:
        src: "config/"
        dest: "{{ _stage.path }}/config/"
        mode: "0644"
        directory_mode: "0755"

    - name: Copy docker-compose.core.yml
      ansible.builtin.copy:
        src: "docker-compose.core.yml"
        dest: "{{ _stage.path }}/docker-compose.core.yml"
        mode: "0644"
      
    - name: Copy volumes.yml
      ansible.builtin.copy:
        src: "volumes.yml"
        dest: "{{ _stage.path }}/volumes.yml"
        mode: "0644"

    - name: Compose up -d
      shell: docker compose -f "{{ _stage.path }}/docker-compose.core.yml" -f "{{ _stage.path }}/volumes.yml" up -d
      args: { executable: /bin/bash }
      register: _boot_up

    - name: Wait for manager container to be running
      shell: |
        docker ps --format '{{"{{.Names}}"}}' | grep -E '^{{ _mgr_container }}$' || exit 1
      args: { executable: /bin/bash }
      register: _boot_ps
      retries: 20
      delay: 3
      until: _boot_ps.rc == 0
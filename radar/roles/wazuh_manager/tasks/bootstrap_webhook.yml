#### Bootstrap Webhook ####
- name: Bootstrap webhook (docker compose up)
  become: true
  block:
    - name: Create staging dir for webhook
      tempfile:
        state: directory
        prefix: radarwh
      register: _stage

    - name: Check if webhook container exists (running or stopped)
      shell: |
        docker ps -a --format '{{"{{"}}{{".Names"}}{{"}}"}}' | grep -E '^ad-webhook$'
      args:
        executable: /bin/bash
      register: _webhook_exists
      failed_when: _webhook_exists.rc not in [0,1]
      changed_when: false

    - name: Check if webhook container is running
      shell: |
        docker ps --format '{{"{{"}}{{".Names"}}{{"}}"}}' | grep -E '^ad-webhook$'
      args:
        executable: /bin/bash
      register: _webhook_running
      failed_when: _webhook_running.rc not in [0,1]
      changed_when: false

    - name: Start existing stopped webhook container
      shell: docker start ad-webhook
      args:
        executable: /bin/bash
      when:
        - _webhook_exists.rc == 0
        - _webhook_running.rc != 0

    - name: Stage and start webhook
      when: _webhook_exists.rc != 0
      block:
        - name: Ensure remote webhook stage dirs exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ _stage.path }}"
            - "{{ _stage.path }}/webhook"

        - name: Copy webhook/ (recursive)
          ansible.builtin.copy:
            src: "webhook/"
            dest: "{{ _stage.path }}/webhook/"
            mode: "0644"
            directory_mode: "0755"
            owner: "{{ ansible_user | default(omit) }}"
            group: "{{ ansible_user | default(omit) }}"

        - name: Copy docker-compose.webhook.yml
          ansible.builtin.copy:
            src: "docker-compose.webhook.yml"
            dest: "{{ _stage.path }}/docker-compose.webhook.yml"
            mode: "0644"

        - name: Copy .env
          ansible.builtin.copy:
            src: ".env"
            dest: "{{ _stage.path }}/.env"
            mode: "0400"

        - name: docker compose up webhook
          shell: docker compose --env-file "{{ _stage.path }}/.env" -f "{{ _stage.path }}/docker-compose.webhook.yml" up -d
          args:
            executable: /bin/bash
          register: _webhook_boot_up

        - name: Wait for webhook container to be running
          shell: |
            docker ps --format '{{"{{.Names}}"}}' | grep -E 'ad-webhook' || exit 1
          args:
            executable: /bin/bash
          register: _webhook_boot_ps
          retries: 20
          delay: 3
          until: _webhook_boot_ps.rc == 0
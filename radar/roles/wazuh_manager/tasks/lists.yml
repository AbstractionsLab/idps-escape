#### whitelist / lists ####
- name: lists | Stat whitelist source on controller
  delegate_to: localhost
  become: false
  stat:
    path: "{{ whitelist_src }}"
  register: _wl_src_stat
  changed_when: false

- name: lists | Ensure host lists dir exists
  file:
    path: "{{ _host_lists_dir }}"
    state: directory
  when: _wl_src_stat.stat.exists

- name: lists | Copy whitelist_countries to host lists dir
  copy:
    src: "{{ whitelist_src }}"
    dest: "{{ _host_lists_dir }}/whitelist_countries"
    mode: "0664"
  register: _wl_copied
  when: _wl_src_stat.stat.exists

- name: lists | Normalize lists file ownership/mode in container
  when: _wl_src_stat.stat.exists
  ansible.builtin.shell: |
    docker exec "{{ _mgr_container }}" bash -lc '
      chown root:wazuh /var/ossec/etc/lists/whitelist_countries 2>/dev/null || true
      chmod 0750 /var/ossec/etc/lists/whitelist_countries 2>/dev/null || true
    '
  args:
    executable: /bin/bash
  register: _lists_permfix
  changed_when: false

- name: lists | Ensure whitelist <list> entry exists in ossec.conf
  become: "{{ _mgr_mode == 'docker_remote' }}"
  ansible.builtin.lineinfile:
    path: "{{ _host_ossec_conf }}"
    insertafter: '<ruleset>'
    line: "    <list>etc/lists/whitelist_countries</list>"
    state: present
  register: _wl_list_entry
  when: _wl_src_stat.stat.exists

#### ossec.conf (volume-mapped) ####
- name: ossec | Check RADAR ossec snippet exists on controller
  delegate_to: localhost
  become: false
  stat:
    path: "{{ radar_snippet_src }}"
  register: _radar_ossec_snip
  changed_when: false

- name: ossec | Ensure host ossec.conf exists
  ansible.builtin.file:
    path: "{{ _host_ossec_conf }}"
    state: file

- name: ossec | Insert RADAR ossec snippet into host ossec.conf (idempotent)
  when: _radar_ossec_snip.stat.exists
  ansible.builtin.blockinfile:
    path: "{{ _host_ossec_conf }}"
    marker: "<!-- RADAR: {{ scenario_name }} {mark} -->"
    insertbefore: '</ossec_config>'
    block: "{{ lookup('file', radar_snippet_src) }}"
    backup: false
  register: _ossec_insert

- name: ossec | Check if 0310-ssh.xml exists in host decoders dir
  stat:
    path: "{{ _host_decoders_dir }}/0310-ssh.xml"
  register: _ssh_decoder_present
  changed_when: false

- name: ossec | Ensure default SSH decoders are excluded when 0310-ssh.xml exists (host ossec.conf)
  when: _ssh_decoder_present.stat.exists
  ansible.builtin.blockinfile:
    path: "{{ _host_ossec_conf }}"
    marker: "<!-- RADAR: ssh decoder_exclude {mark} -->"
    insertbefore: "</ruleset>"
    block: |
      <decoder_exclude>0310-ssh_decoders.xml</decoder_exclude>
    backup: false
  register: _ssh_decoder_exclude_insert

- name: ossec | Check if 0375-web-accesslog.xml exists in host decoders dir
  stat:
    path: "{{ _host_decoders_dir }}/0375-web-accesslog.xml"
  register: _web_accesslog_decoder_present
  changed_when: false

- name: ossec | Ensure default Web Access Log decoders are excluded when 0375-web-accesslog.xml exists (host ossec.conf)
  when: _web_accesslog_decoder_present.stat.exists
  ansible.builtin.blockinfile:
    path: "{{ _host_ossec_conf }}"
    marker: "<!-- RADAR: web-accesslog decoder_exclude {mark} -->"
    insertbefore: "</ruleset>"
    block: |
      <decoder_exclude>0375-web-accesslog_decoders.xml</decoder_exclude>
    backup: false
  register: _web_accesslog_decoder_exclude_insert

- name: ossec | Ensure logall is 'yes' (host ossec.conf)
  ansible.builtin.replace:
    path: "{{ _host_ossec_conf }}"
    regexp: '(<logall>)[^<]*(</logall>)'
    replace: '\1yes\2'
    backup: no
  register: _ossec_logall

- name: ossec | Ensure logall_json is 'yes' (host ossec.conf)
  ansible.builtin.replace:
    path: "{{ _host_ossec_conf }}"
    regexp: '(<logall_json>)[^<]*(</logall_json>)'
    replace: '\1yes\2'
    backup: no
  register: _ossec_logall_json

- name: ossec | Normalize ossec.conf ownership/mode in container
  ansible.builtin.shell: |
    docker exec "{{ _mgr_container }}" bash -lc '
      chown root:wazuh /var/ossec/etc/ossec.conf 2>/dev/null || true
      chmod 0640 /var/ossec/etc/ossec.conf 2>/dev/null || true
    '
  args:
    executable: /bin/bash
  changed_when: false

- name: ossec | Decide if restart is needed
  ansible.builtin.set_fact:
    _restart_needed: >-
      {{
        (_ossec_insert is defined and _ossec_insert.changed) or
        (_ssh_decoder_exclude_insert is defined and _ssh_decoder_exclude_insert.changed) or
        (_web_accesslog_decoder_exclude_insert is defined and _web_accesslog_decoder_exclude_insert.changed) or
        (_ossec_logall is defined and _ossec_logall.changed) or
        (_ossec_logall_json is defined and _ossec_logall_json.changed) or
        (_decoders_copied is defined and _decoders_copied is changed) or
        (_rules_copied is defined and _rules_copied is changed) or
        (_wl_list_entry is defined and _wl_list_entry is changed)
      }}

- name: ossec | Restart Wazuh service in manager container if needed
  ansible.builtin.command: docker exec "{{ _mgr_container }}" /var/ossec/bin/wazuh-control restart
  when: _restart_needed | default(false) | bool

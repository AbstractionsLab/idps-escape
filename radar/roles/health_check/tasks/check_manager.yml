---
- name: mgr | containers running
  shell: |
    out=""
    for c in {{ _mgr_container }} ad-webhook; do
      docker ps --format "{{ '{{' }}.Names{{ '}}' }}" 2>/dev/null | grep -qx "$c" \
        && out="${out}OK - container ${c} running\n" \
        || out="${out}FAIL - container ${c} not running\n"
    done
    printf '%b' "$out"
  args:
    executable: /bin/bash
  register: _r_containers
  changed_when: false
  failed_when: false
  when: _mgr_mode in ['docker_local', 'docker_remote']

- set_fact:
    _health_report: "{{ _health_report + (_r_containers.stdout_lines | default([])) }}"
  when: _mgr_mode in ['docker_local', 'docker_remote']

- name: mgr | ossec.log errors (ERROR/CRITICAL)
  shell: |
    _x="{{ _exec }}"
    log="/var/ossec/logs/ossec.log"
    if $_x test -f "$log" 2>/dev/null; then
      hits=$($_x bash -lc "tail -n 500 '$log' | egrep -n 'ERROR|CRITICAL' | head -n 20" || true)
      if [ -n "$hits" ]; then
        echo "FAIL - ossec.log contains ERROR/CRITICAL (last 500 lines):"
        echo "$hits" | sed 's/^/FAIL -   /'
      else
        echo "OK - ossec.log has no ERROR/CRITICAL in last 500 lines"
      fi
    else
      echo "WARN - ossec.log not found at $log"
    fi
  args:
    executable: /bin/bash
  register: _r_ossec_err
  changed_when: false
  failed_when: false

- set_fact:
    _health_report: "{{ _health_report + (_r_ossec_err.stdout_lines | default([])) }}"

- name: mgr | wazuh service running (host_remote)
  shell: /var/ossec/bin/wazuh-control status | grep -c 'is running' || true
  register: _r_svc
  changed_when: false
  failed_when: false
  when: _mgr_mode == 'host_remote'

- set_fact:
    _health_report: >-
      {{ _health_report + [
        'OK - Wazuh manager service running (' + (_r_svc.stdout | trim) + ' processes)'
        if (_r_svc.stdout | trim | int) > 0
        else 'FAIL - Wazuh manager service not running'
      ] }}
  when: _mgr_mode == 'host_remote'

- name: mgr | key files (radar_ar.py, ar.yaml, env, ossec.conf, agent.conf)
  shell: |
    _x="{{ _exec }}"
    out=""
    check_file() {
      local label="$1" path="$2" severity="$3"
      if $_x test -f "$path" 2>/dev/null; then
        local grp
        grp=$($_x stat -c '%G' "$path" 2>/dev/null || echo unknown)
        [ "$grp" = "wazuh" ] \
          && out="${out}OK - $label present (group: wazuh)\n" \
          || out="${out}WARN - $label group is '$grp' (expected wazuh)\n"
      else
        out="${out}${severity} - $label not found at $path\n"
      fi
    }
    check_file "radar_ar.py"          /var/ossec/active-response/bin/radar_ar.py          FAIL
    check_file "ar.yaml"              /var/ossec/active-response/bin/ar.yaml              FAIL
    check_file "active_responses.env" /var/ossec/active-response/bin/active_responses.env FAIL
    check_file "ossec.conf"           /var/ossec/etc/ossec.conf                           FAIL
    check_file "agent.conf"           /var/ossec/etc/shared/default/agent.conf            WARN
    printf '%b' "$out"
  args:
    executable: /bin/bash
  register: _r_files
  changed_when: false
  failed_when: false

- set_fact:
    _health_report: "{{ _health_report + (_r_files.stdout_lines | default([])) }}"

- name: mgr | verify radar_ar wiring in ossec.conf
  shell: |
    _x="{{ _exec }}"
    conf="/var/ossec/etc/ossec.conf"

    if ! $_x test -f "$conf" 2>/dev/null; then
      echo "FAIL - ossec.conf not found at $conf"
      exit 0
    fi

    lines=$($_x bash -lc "grep radar_ar '$conf'" || true)

    if [ -z "$lines" ]; then
      echo "FAIL - ossec.conf does not reference radar_ar"
      exit 0
    fi

    echo "$lines" | grep -q "<executable>" \
      && exec_ok=1 || exec_ok=0

    echo "$lines" | grep -q "<command>" \
      && cmd_ok=1 || cmd_ok=0

    if [ "$exec_ok" -eq 1 ] && [ "$cmd_ok" -eq 1 ]; then
      echo "OK - ossec.conf contains radar_ar executable and command wiring"
    else
      [ "$exec_ok" -eq 0 ] && echo "FAIL - missing <executable>radar_ar.py</executable>"
      [ "$cmd_ok" -eq 0 ] && echo "FAIL - missing <command>...radar_ar...</command>"
    fi
  args:
    executable: /bin/bash
  register: _r_ar_wiring
  changed_when: false
  failed_when: false

- set_fact:
    _health_report: "{{ _health_report + (_r_ar_wiring.stdout_lines | default([])) }}"

- name: mgr | define expected decoder and rule files per scenario
  set_fact:
    _scenario_files:
      geoip_detection:
        decoders:
          - /var/ossec/etc/decoders/0310-ssh.xml
          - /var/ossec/etc/decoders/0375-web-accesslog.xml
        rules:
          - /var/ossec/etc/rules/a2-geoip-detection.xml
      suspicious_login:
        decoders:
          - /var/ossec/etc/decoders/0310-ssh.xml
        rules:
          - /var/ossec/etc/rules/a3-suspicious-login.xml
      log_volume:
        decoders:
          - /var/ossec/etc/decoders/0001-ad-common.xml
          - /var/ossec/etc/decoders/0001-log-volume.xml
        rules:
          - /var/ossec/etc/rules/a1-log-volume.xml

- name: mgr | build file list for target scenarios
  set_fact:
    _files_to_check: >-
      {{
        _target_scenarios
        | map('extract', _scenario_files)
        | map(attribute='decoders') | flatten
        + _target_scenarios
        | map('extract', _scenario_files)
        | map(attribute='rules') | flatten
        | unique
      }}

- name: mgr | stat decoder and rule files
  shell: >
    {{ _exec }} stat -c '%n %G %a' {{ item }} 2>/dev/null
    || echo "{{ item }} MISSING -"
  loop: "{{ _files_to_check }}"
  register: _r_file_stats
  changed_when: false
  failed_when: false

- name: mgr | evaluate decoder and rule file results
  set_fact:
    _health_report: >-
      {{ _health_report + [
        'OK - ' + (item.stdout.split()[0] | basename) + ' present (group: ' + item.stdout.split()[1] + ')'
        if item.stdout.split()[1] | default('') == 'wazuh'
        else 'WARN - ' + (item.stdout.split()[0] | basename) + ' group is ' + item.stdout.split()[1] | default('?')
        if item.stdout.split()[1] | default('') not in ['MISSING', '']
        else 'FAIL - ' + item.item + ' not found'
      ] }}
  loop: "{{ _r_file_stats.results }}"

- name: mgr | python dependencies
  shell: |
    _x="{{ _exec }}"
    out=""
    v=$($_x python3 --version 2>&1 | head -1)
    echo "$v" | grep -q '^Python' \
      && out="${out}OK - $v available\n" \
      || out="${out}FAIL - python3 not found\n"
    $_x python3 -c "import yaml"     2>/dev/null \
      && out="${out}OK - pyyaml available\n"    || out="${out}FAIL - pyyaml not available\n"
    $_x python3 -c "import requests" 2>/dev/null \
      && out="${out}OK - requests available\n"  || out="${out}FAIL - requests not available\n"
    printf '%b' "$out"
  args:
    executable: /bin/bash
  register: _r_deps
  changed_when: false
  failed_when: false

- set_fact:
    _health_report: "{{ _health_report + (_r_deps.stdout_lines | default([])) }}"


- name: mgr | OpenSearch cluster health
  uri:
    url: "{{ os_url }}/_cluster/health"
    url_username: "{{ os_user }}"
    url_password: "{{ os_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
  delegate_to: localhost
  register: _r_os
  failed_when: false

- set_fact:
    _health_report: >-
      {{ _health_report + [
        'OK - OpenSearch reachable (cluster: ' + (_r_os.json.status | default('?')) + ')'
        if _r_os.status | default(0) == 200
        else 'FAIL - OpenSearch not reachable at ' + os_url
      ] }}

- name: mgr | Wazuh API authentication
  uri:
    url: "{{ wazuh_api_url }}/security/user/authenticate"
    method: POST
    url_username: "{{ wazuh_auth_user }}"
    url_password: "{{ wazuh_auth_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
  delegate_to: localhost
  register: _r_wapi
  failed_when: false

- set_fact:
    _health_report: >-
      {{ _health_report + [
        'OK - Wazuh API authenticated'
        if _r_wapi.status | default(0) == 200
        else 'WARN - Wazuh API auth failed at ' + wazuh_api_url + ' (check credentials)'
      ] }}

- name: mgr | Webhook endpoint reachable
  uri:
    url: "{{ webhook_url }}"
    validate_certs: no
    status_code: [200, 404, 405]
  delegate_to: localhost
  register: _r_wh
  failed_when: false
  when: webhook_url | default('') | length > 0

- set_fact:
    _health_report: >-
      {{ _health_report + [
        'OK - Webhook reachable at ' + webhook_url
        if _r_wh.status | default(0) in [200, 404, 405]
        else 'WARN - Webhook not reachable at ' + webhook_url
      ] }}
  when: webhook_url | default('') | length > 0

- name: mgr | log_volume checks (pipeline patch + index template)
  block:
    - name: mgr | log_volume pipeline patch
      shell: >
        {{ _exec }} grep -q 'log_volume_metric'
        /usr/share/filebeat/module/wazuh/archives/ingest/pipeline.json 2>/dev/null
        && echo OK || echo FAIL
      register: _r_lv_pipe
      changed_when: false
      failed_when: false

    - set_fact:
        _health_report: >-
          {{ _health_report + [
            'OK - log_volume pipeline patch present'
            if 'OK' in (_r_lv_pipe.stdout | default(''))
            else 'FAIL - log_volume pipeline patch missing (run build-radar.sh)'
          ] }}

    - name: mgr | log_volume index template in OpenSearch
      uri:
        url: "{{ os_url }}/_index_template/radar-log-volume"
        url_username: "{{ os_user }}"
        url_password: "{{ os_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
      delegate_to: localhost
      register: _r_lv_tmpl
      failed_when: false

    - set_fact:
        _health_report: >-
          {{ _health_report + [
            'OK - radar-log-volume index template found in OpenSearch'
            if _r_lv_tmpl.status | default(0) == 200
            else 'FAIL - radar-log-volume index template missing (run build-radar.sh)'
          ] }}
  when: "'log_volume' in _target_scenarios"

- name: mgr | geoip whitelist_countries (existence + group)
  block:
    - shell: |
        _x="{{ _exec }}"
        if $_x test -f /var/ossec/etc/lists/whitelist_countries 2>/dev/null; then
          grp=$($_x stat -c '%G' /var/ossec/etc/lists/whitelist_countries 2>/dev/null || echo unknown)
          [ "$grp" = "wazuh" ] \
            && echo "OK - whitelist_countries present (group: wazuh)" \
            || echo "WARN - whitelist_countries group is '$grp' (expected wazuh)"
        else
          echo "FAIL - whitelist_countries not found at /var/ossec/etc/lists/"
        fi
      args:
        executable: /bin/bash
      register: _r_wl
      changed_when: false
      failed_when: false

    - set_fact:
        _health_report: "{{ _health_report + [_r_wl.stdout | trim] }}"
  when: "'geoip_detection' in _target_scenarios"
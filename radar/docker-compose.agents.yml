services:
  agent.suspicious:
    build:
      context: scenarios/dockerfiles
      dockerfile: Dockerfile.suspicious_login_agent
    container_name: agent.suspicious
    restart: always
    # networks:
    #   - soar-radar
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=secret
    command: start-dev
    volumes:
      - ./config/wazuh_agent/local_internal_options.conf:/wazuh-config-mount/etc/local_internal_options.conf

  agent.geoip:
    build:
      context: scenarios/dockerfiles
      dockerfile: Dockerfile.geoip_detection_agent
    container_name: agent.geoip
    # networks:
    #   - soar-radar
    tty: true
    command: [ "tail", "-f", "/dev/null" ]
    volumes:
      - ./config/wazuh_agent/local_internal_options.conf:/wazuh-config-mount/etc/local_internal_options.conf

  agent.logvolume:
    build:
      context: scenarios/dockerfiles
      dockerfile: Dockerfile.log_volume_agent
    container_name: agent.logvolume
    # networks:
    #   - soar-radar
    tty: true
    command: [ "tail", "-f", "/dev/null" ]
    volumes:
      - ./config/wazuh_agent/local_internal_options.conf:/wazuh-config-mount/etc/local_internal_options.conf

